          type: string
        city:
          type: string
        phone:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        lang:
          type: string
        is_active:
          type: boolean
        created_date:
          type: string
          format: date-time
        logo:
          type: string
        levels:
          type: string
        surveys:
          type: string
        users:
          type: string
        responses:
          type: string
      additionalProperties:
        type: string
    SurveyDetail_read:
