          - email
          - sms_trans
          - sms_conv
          - sms_text
          - plv
          - receipt
          - google
          - google_messaging
          - critizr
          - tripadvisor
          - pagesjaunes
          - sdk
          - facebook
          - facebook_reviews
          - facebook_messenger
          - widget
          - terminal
          - outbound_call
          - wifi
          - sms
          - api
          - undefined
          - merci
          - google_play_store
          - apple_app_store
          - uber_eats
          - whatsapp
