                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                opt_in:
                  type: object
                  properties:
                    newsletter:
                      type: boolean
                    email:
                      type: boolean
                    sms:
                      type: boolean
                  additionalProperties:
                    type: string
              additionalProperties:
                type: string
            context:
              type: string
            place:
              type: object
              properties:
                id:
                  type: string
                partner_id:
                  type: string
                name:
                  type: string
                enabled:
                  type: boolean
                detail_url:
                  type: string
              additionalProperties:
                type: string
            delegated_to:
              type: object
              properties:
                id:
                  type: string
                partner_id:
                  type: string
                name:
                  type: string
                enabled:
                  type: boolean
                detail_url:
                  type: string
              additionalProperties:
