              - outbound_call
              - wifi
              - sms
              - api
              - undefined
              - merci
              - google_play_store
              - apple_app_store
              - uber_eats
              - whatsapp
            survey:
              type: object
              properties:
                id:
                  type: string
                slug:
                  type: string
                label:
                  type: string
                enabled:
                  type: boolean
                detail_url:
                  type: string
              additionalProperties:
                type: string
            answers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  value:
                    type: string
                  question:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      type:
                        type: string
                        enum:
                        - none
                        - stars
                        - yesno
                        - choices
                        - nps
                        - emoji
                        - text
                        - multiple_answers
                        - csat
                      enabled:
                        type: boolean
                    additionalProperties:
                      type: string
                additionalProperties:
                  type: string
            message:
              type: object
              properties:
                id:
                  type: string
                created_date:
                  type: string
                  format: date-time
                type:
                  type: string
                  enum:
                  - Question
                  - Idea
                  - Problem
                  - Praise
                  - Message
                  - NoType
                content:
                  type: string
                attachment:
                  type: string
                sender:
                  type: object
                  properties:
                    email:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                  additionalProperties:
                    type: string
              additionalProperties:
                type: string
            reply:
              type: object
              properties:
                id:
                  type: string
                created_date:
                  type: string
                  format: date-time
                type:
                  type: string
