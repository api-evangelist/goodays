            attached_messages:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  created_date:
                    type: string
                    format: date-time
                  type:
                    type: string
                    enum:
                    - Question
                    - Idea
                    - Problem
                    - Praise
                    - Message
                    - NoType
                  content:
                    type: string
                  attachment:
                    type: string
                  sender:
                    type: object
                    properties:
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                    additionalProperties:
                      type: string
                additionalProperties:
                  type: string
            state:
              type: string
              enum:
              - open
              - closed
              - spam
            thread:
              type: string
            actions:
              type: object
              additionalProperties:
                type: string
            alert_triggered:
              type: boolean
          additionalProperties:
            type: string
        message:
          type: object
          properties:
            id:
              type: string
            created_date:
