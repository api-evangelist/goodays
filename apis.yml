aid: goodays
name: Goodays
description: >-
  Goodays (formerly Critizr) is Europe's leading customer experience management
  platform, founded in 2012 and headquartered in Lille, France, helping retailers
  and multi-location brands understand and act on customer feedback across every
  point of sale. Its REST API v2 (api.goodays.co/v2) exposes a Core API for the
  place/level/survey/user hierarchy, a Response API to read and reply to customer
  reviews, a Solicitation API to request feedback by email/SMS, a Collect API for
  first-party collection sources, and a Metrics API for NPS, satisfaction,
  relationship, Google-score, dissatisfaction and retained-customer statistics.
  Goodays also ships Web, iOS and Android SDKs and embeddable feedback widgets.
  Added to the API Evangelist network as a point-nine portfolio lead and enriched
  by the pipeline from Goodays' public developer documentation.
